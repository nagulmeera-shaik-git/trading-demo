server:
  port: 8083

spring:
  application:
    name: watchlist-service

  datasource:
    url: jdbc:postgresql://localhost:5432/watchlist_db
    username: trading
    password: trading
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate     # Flyway owns the schema; Hibernate only checks it matches the entities
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

# Other services this service calls
clients:
  market-data:
    base-url: http://localhost:8082
    connect-timeout: 1s
    read-timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    # set to DEBUG to see every SQL statement Hibernate runs
    org.hibernate.SQL: INFO
