server:
  port: 8082
spring:
  application:
    name: market-data-service

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # if Kafka is down, give up after 2 s instead of blocking the price feed for 60 s
        max.block.ms: 2000
    consumer:
      group-id: market-data-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.demo.common.events

  profiles:
    # mock = random prices, works any time (default)
    # kite = real NSE prices from Zerodha Kite Connect (Phase 7)
    active: mock

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Demo instruments for the mock feed (prices in rupees).
market:
  mock:
    tick-interval-ms: 500
    instruments:
      INFY: 1500.00
      TCS: 3900.00
      RELIANCE: 1300.00
      HDFCBANK: 1700.00
      ICICIBANK: 1250.00
      SBIN: 800.00
      ITC: 450.00
      LT: 3500.00
      WIPRO: 300.00
      TATAMOTORS: 700.00
